name: loonie_split
description: "Loonie Split - The Bill Splitter in Canada"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  # HTTP for fetching tax data
  http: ^1.2.0
  # Camera and image handling
  image_picker: ^1.0.7
  # OCR text recognition
  google_mlkit_text_recognition: ^0.13.0
  # Permission handling
  permission_handler: ^11.3.0
  # Location services
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  # PDF and export
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.2
  share_plus: ^10.1.3
  # Contacts access
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
